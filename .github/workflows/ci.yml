  #   runs-on: ubuntu-24.04
  #   container: robotics-ws:dev   # built by the docker job
  #   steps:
  #     - run: |
  #         ros2 launch robot_description mission.launch.py headless:=true &
  #         timeout 300 ros2 topic echo /mission/status --once --field data
